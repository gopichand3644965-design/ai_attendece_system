services:
  - type: web
    name: ai-attendance-system
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt && pip uninstall -y opencv-python scikit-image networkx imageio tifffile lazy-loader
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: FACE_MODEL
        value: buffalo_s
      - key: DET_SIZE
        value: "320"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
