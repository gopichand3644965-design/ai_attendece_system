name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:   # Allow manual re-deploy from GitHub Actions UI

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true   # In case model files are in Git LFS

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286879406932:role/gopi_attendence_system
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Fix line endings and make hooks executable
        run: |
          # Convert CRLF to LF for all shell scripts and Procfile (Windows -> Linux)
          sudo apt-get install -y dos2unix
          find . -name "*.sh" -exec dos2unix {} \;
          dos2unix Procfile
          dos2unix .ebextensions/*.config
          chmod +x .platform/hooks/predeploy/*.sh

      - name: Zip application (excluding unnecessary files)
        run: |
          zip -r app.zip . \
            -x "*.git*" \
            -x "venv/*" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x ".pytest_cache/*" \
            -x "recognition.zip" \
            -x "recognition/*" \
            -x "*.whl" \
            -x "dummy_img.jpg" \
            -x "real_face.jpg" \
            -x "temp_live_app.js" \
            -x "tests/*" \
            -x "scratch/*" \
            -x "e2e_test_script.py" \
            -x "render.yaml" \
            -x ".vscode/*" \
            -x ".idea/*"

      - name: Show zip size
        run: |
          ls -lh app.zip
          echo "Zip contents (first 50 files):"
          unzip -l app.zip | head -50

      - name: Upload to S3
        run: |
          aws s3 mb s3://gopi-attendence-deployments-286879406932 --region eu-north-1 || true
          aws s3 cp app.zip s3://gopi-attendence-deployments-286879406932/app-${{ github.sha }}.zip

      - name: Create Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name AI_Attendence_system \
            --version-label "ver-${{ github.sha }}" \
            --source-bundle S3Bucket="gopi-attendence-deployments-286879406932",S3Key="app-${{ github.sha }}.zip" \
            --region eu-north-1 || echo "Version already exists, proceeding with deploy"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name AI_Attendence_system \
            --environment-name AIAttendencesystem-env \
            --version-label "ver-${{ github.sha }}" \
            --region eu-north-1

      - name: Wait for deployment to complete
        id: wait_deploy
        run: |
          echo "Waiting for environment to be ready (timeout: 10 minutes)..."
          aws elasticbeanstalk wait environment-updated \
            --application-name AI_Attendence_system \
            --environment-names AIAttendencesystem-env \
            --region eu-north-1 || {
              echo "::warning::Deployment wait timed out. Check EB console for status."
              aws elasticbeanstalk describe-environment-health \
                --environment-name AIAttendencesystem-env \
                --attribute-names All \
                --region eu-north-1
              exit 1
            }

      - name: Retrieve EB logs on failure
        if: failure()
        run: |
          echo "=== Requesting instance logs ==="
          aws elasticbeanstalk request-environment-info \
            --environment-name AIAttendencesystem-env \
            --info-type tail \
            --region eu-north-1
          sleep 15
          echo "=== Downloading instance logs ==="
          aws elasticbeanstalk retrieve-environment-info \
            --environment-name AIAttendencesystem-env \
            --info-type tail \
            --region eu-north-1 \
            --query 'EnvironmentInfo[*].Message' \
            --output text | head -500

      - name: Show recent EB events on failure
        if: failure()
        run: |
          echo "=== Recent Elastic Beanstalk events ==="
          aws elasticbeanstalk describe-events \
            --environment-name AIAttendencesystem-env \
            --region eu-north-1 \
            --max-items 20

      - name: Verify deployment health
        run: |
          HEALTH=$(aws elasticbeanstalk describe-environment-health \
            --environment-name AIAttendencesystem-env \
            --attribute-names HealthStatus \
            --region eu-north-1 \
            --query 'HealthStatus' --output text)
          echo "Environment health: $HEALTH"
          if [ "$HEALTH" = "Severe" ]; then
            echo "::error::Deployment health is Severe!"
            aws elasticbeanstalk describe-events \
              --environment-name AIAttendencesystem-env \
              --region eu-north-1 \
              --max-items 10
            exit 1
          fi
