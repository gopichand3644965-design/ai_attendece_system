name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::286879406932:role/gopi_attendence_system
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Zip application
        run: zip -r app.zip . -x "*.git*"

      - name: Upload to S3
        run: |
          aws s3 mb s3://gopi-attendence-deployments-286879406932 --region eu-north-1 || true
          aws s3 cp app.zip s3://gopi-attendence-deployments-286879406932/app-${{ github.sha }}.zip

      - name: Create Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name AI_Attendence_system \
            --version-label "ver-${{ github.sha }}" \
            --source-bundle S3Bucket="gopi-attendence-deployments-286879406932",S3Key="app-${{ github.sha }}.zip" \
            --region eu-north-1

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name AI_Attendence_system \
            --environment-name AIAttendencesystem-env \
            --version-label "ver-${{ github.sha }}" \
            --region eu-north-1

      - name: Wait for deployment to complete
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name AI_Attendence_system \
            --environment-names AIAttendencesystem-env \
            --region eu-north-1
